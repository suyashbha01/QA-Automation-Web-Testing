[pytest]
markers =
    testcase1: tests for the Products page and sorting
    testcase2: tests for adding products to the cart
    testcase3: tests for randomly adding products
    testcase4: tests for removing products
    testcase5: tests for randomly removing products
    testcase6: tests for valid checkout
    testcase7: tests for checkout field validation
    testcase8: tests for the final thank-you confirmation page
    testcase9: tests for sidebar functionality
    testcase10: tests for closing the sidebar
    testcase11: tests for the All Items sidebar link
    testcase12: tests for the About sidebar link
    testcase13: tests for Reset App State
    testcase14: tests for logout functionality