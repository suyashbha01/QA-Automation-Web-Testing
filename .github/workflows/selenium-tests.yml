      - name: Run SauceDemo tests
        run: python -m pytest SauceDemo-Testing/test_main_website.py -v --html=report.html --self-contained-html

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report
          path: report.html
          if-no-files-found: ignore